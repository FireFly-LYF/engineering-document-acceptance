version: '1.0.0'
# Semantic keys are stable; aliases and descriptions are editable. No global fuzzy pass.
fields:
  project_name: {label: 项目名称, type: text, aliases: [工程名称, 项目名称], description: 本资料主体所属工程的完整名称，保留子项目和期次, comparator: normalized_exact, comparison_scope: project}
  project_code: {label: 项目编号, type: identifier, aliases: [项目编号, 工程编号], description: 项目自身编号而非文件编号或附件引用编号, comparator: normalized_exact, comparison_scope: project}
  owner: {label: 建设单位, type: organization, aliases: [建设单位, 建设方, 发包人], description: 本工程建设单位，不能以收文单位或施工单位代替, comparator: normalized_exact, comparison_scope: project}
  contractor: {label: 施工单位, type: organization, aliases: [施工单位, 承包人, 总承包单位], description: 当前合同或施工范围的施工主体，分包单位应保留范围, comparator: normalized_exact, comparison_scope: contract}
  supervisor: {label: 监理单位, type: organization, aliases: [监理单位, 工程监理单位], description: 本工程受托监理主体, comparator: normalized_exact, comparison_scope: project}
  designer: {label: 设计单位, type: organization, aliases: [设计单位, 设计院], description: 对当前专业或范围负责的设计单位, comparator: normalized_exact, comparison_scope: discipline}
  surveyor: {label: 勘察单位, type: organization, aliases: [勘察单位, 岩土勘察单位], description: 本工程勘察责任主体, comparator: normalized_exact, comparison_scope: project}
  address: {label: 工程地址, type: text, aliases: [工程地址, 建设地点, 工程地点], description: 工程建设地点而非单位注册地址, comparator: normalized_exact, comparison_scope: project}
  unit_name: {label: 单位工程名称, type: text, aliases: [单位工程名称, 单位（子单位）工程名称], description: 资料覆盖的楼栋或单位工程名称, comparator: normalized_exact, comparison_scope: unit}
  discipline: {label: 专业, type: text, aliases: [专业, 专业名称], description: 建筑结构电气给排水等专业，不由模型猜测补全, comparator: normalized_exact, comparison_scope: unit}
  location: {label: 工程部位, type: text, aliases: [工程部位, 施工部位, 验收部位, 检验部位], description: 楼层轴线区段等具体覆盖部位, comparator: normalized_exact, comparison_scope: location}
  document_no: {label: 文件编号, type: identifier, aliases: [文件编号, 报告编号, 记录编号], description: 当前文件的自身编号，不能与项目编号混用, comparator: normalized_exact, comparison_scope: document}
  contract_no: {label: 合同编号, type: identifier, aliases: [合同编号, 合同号], description: 当前合同或明确引用合同的编号，记录主体或引用角色, comparator: normalized_exact, comparison_scope: contract}
  permit_no: {label: 许可证号, type: identifier, aliases: [许可证号, 施工许可证号, 规划许可证号], description: 许可文件自身编号，不跨不同许可类型比较, comparator: normalized_exact, comparison_scope: tag}
  contract_amount: {label: 合同金额, type: money, aliases: [合同金额, 签约合同价, 施工合同金额], unit: CNY, description: 当前合同的原始签约总额，不能与结算金额或调整金额混用, comparator: decimal_exact, comparison_scope: contract}
  revised_contract_amount: {label: 变更后合同金额, type: money, aliases: [变更后合同金额, 调整后合同价], unit: CNY, description: 经明确变更文件记载的调整金额，不能覆盖原始合同额, comparator: decimal_exact, comparison_scope: contract_version}
  settlement_amount: {label: 结算金额, type: money, aliases: [结算金额, 工程结算价], unit: CNY, description: 工程结算金额，不能因与合同价不同而自动判冲突, comparator: decimal_exact, comparison_scope: contract}
  start_date: {label: 实际开工日期, type: date, aliases: [开工日期, 实际开工日期], description: 实际开工日期，不与计划开工日期混用, comparator: date_exact, comparison_scope: unit}
  finish_date: {label: 实际竣工日期, type: date, aliases: [竣工日期, 实际竣工日期], description: 实际完工日期，不与验收日期混用, comparator: date_exact, comparison_scope: unit}
  acceptance_date: {label: 验收日期, type: date, aliases: [验收日期, 竣工验收日期], description: 当前资料对应的验收事件日期，同一事件才比较, comparator: date_exact, comparison_scope: event}
  issue_date: {label: 文件出具日期, type: date, aliases: [出具日期, 报告日期, 签发日期], description: 当前文件出具日期，不要求所有报告同一天, comparator: date_exact, comparison_scope: document}
  test_date: {label: 检测日期, type: date, aliases: [检测日期, 试验日期], description: 当前检测事件日期, comparator: date_exact, comparison_scope: sample}
  sample_no: {label: 样品或批次编号, type: identifier, aliases: [样品编号, 批次编号, 试样编号], description: 材料检测对象编号，与送检和部位关系一并保留, comparator: normalized_exact, comparison_scope: sample}
  material_name: {label: 材料名称, type: text, aliases: [材料名称, 样品名称], description: 当前复试或检测材料名称, comparator: normalized_exact, comparison_scope: sample}
  specification: {label: 规格型号, type: text, aliases: [规格型号, 规格, 型号], description: 当前材料或设备规格，不跨不同材料比较, comparator: normalized_exact, comparison_scope: sample}
  conclusion: {label: 文载结论, type: text, aliases: [验收结论, 检测结论, 评估结论, 检查结论], description: 原文记载的结论，文载合格不等于系统确认工程质量合格, comparator: none, comparison_scope: document}
  drawing_no: {label: 图号, type: identifier, aliases: [图号, 图纸编号], description: 当前图纸编号，与专业和版本共同识别, comparator: normalized_exact, comparison_scope: drawing}
  revision: {label: 版本号, type: identifier, aliases: [版本号, 修订号, 图纸版本], description: 文载版本，不由文件名副本推断, comparator: normalized_exact, comparison_scope: document}
  change_no: {label: 设计变更编号, type: identifier, aliases: [设计变更编号, 变更通知单编号], description: 自身变更编号或明确引用编号，记录引用关系, comparator: normalized_exact, comparison_scope: change}
  building_area: {label: 建筑面积, type: area, aliases: [建筑面积, 总建筑面积], unit: m2, description: 当前审批或竣工阶段及范围的面积，不同口径不可直接比较, comparator: decimal_exact, comparison_scope: unit_stage}
  building_height: {label: 建筑高度, type: length, aliases: [建筑高度], unit: m, description: 当前单体建筑高度，消防分类仍需核实全部法定条件, comparator: decimal_exact, comparison_scope: unit}
  fire_receipt_no: {label: 消防文书编号, type: identifier, aliases: [消防验收意见书编号, 消防备案凭证编号, 备案表编号], description: 消防行政文书自身编号，不能用申请编号代替办结凭证, comparator: normalized_exact, comparison_scope: tag}
  signature_observation: {label: 签署栏观察, type: text, aliases: [签署情况, 签字盖章情况], description: 仅记录可见栏位及待核实状态，不推断签名真实性或效力, comparator: none, comparison_scope: document}
  seal_observation: {label: 印章观察, type: text, aliases: [印章情况], description: 仅记录可见印章或文字描述，不能认定真实合法有效, comparator: none, comparison_scope: document}
